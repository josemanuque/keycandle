[package]
name = "rk71-configurator"
version = "0.1.0"
edition = "2021"
description = "Configurator for the RK71 QMK firmware (Windows, macOS, Linux)"
license = "GPL-2.0-or-later"

[[bin]]
name = "rk71-configurator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "6"
hidapi = "2.6"
rust-i18n = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
ureq = "2"
# GPUI (Zed's UI framework) as packaged for gpui-component, which provides the widgets
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "0.10"
gpui-kit-assets = "0.10"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
