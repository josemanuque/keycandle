[package]
name = "keycandle"
version = "1.0.2"
edition = "2021"
description = "Configurator for the RK71 QMK firmware (Windows, macOS, Linux)"
license = "GPL-2.0-or-later"

[[bin]]
name = "keycandle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "6"
# macos-shared-device: open devices without seizing them (hidapi's macOS default seizes, which
# would cut a Bluetooth keyboard off from the system and keep a second Keycandle from opening it)
hidapi = { version = "2.6", features = ["macos-shared-device"] }
rust-i18n = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
ureq = "2"
# GPUI (Zed's UI framework) as packaged for gpui-component, which provides the widgets
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = "0.10"
gpui-kit-assets = "0.10"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Liquid Glass sidebar, window appearance and the About panel (AppKit calls GPUI doesn't wrap)
objc2 = "0.6"
objc2-foundation = "0.3"
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Settings over Bluetooth (btlink.rs): the keyboard's LED indicators through Windows' keyboard driver
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security", "Win32_System_Registry"] }
