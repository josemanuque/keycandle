# Español. Mirrors en.yml key for key.
_version: 1

app:
  name: Keycandle
  subtitle: para el RK71
  language: Idioma

page:
  overview:
    title: Resumen
    subtitle: Todo el teclado en un solo lugar. Los cambios se aplican al instante y se guardan en el teclado.
  lighting:
    title: Iluminación
    subtitle: Elige un efecto para verlo aquí y en el teclado. Los cambios se guardan cuando dejas de ajustar.
  keys:
    title: Teclas e indicadores
    subtitle: Cómo se muestran los bloqueos y qué resalta Fn. Windows/Mac se recuerda por dispositivo (Fn + A / Fn + S).
  power:
    title: Energía
    subtitle: El ahorro de batería aplica en Bluetooth sin el cable. Conectado, el teclado nunca se duerme.
  firmware:
    title: Firmware
    subtitle: Actualiza el firmware del teclado o vuelve al original.
  settings:
    title: Ajustes
    subtitle: Preferencias de la propia app. Los ajustes del teclado están en las otras páginas.

