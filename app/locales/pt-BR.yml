# Português (Brasil). Mirrors en.yml key for key.
_version: 1

app:
  name: Keycandle
  subtitle: para o RK71
  language: Idioma

page:
  overview:
    title: Visão geral
    subtitle: Tudo do teclado em um só lugar. As mudanças valem na hora e ficam salvas no teclado.
  lighting:
    title: Iluminação
    subtitle: Escolha um efeito para vê-lo aqui e no teclado. As mudanças são salvas quando você para de ajustar.
  keys:
    title: Teclas e indicadores
    subtitle: Windows ou Mac para cada dispositivo, como os bloqueios aparecem e o que o Fn destaca.
  power:
    title: Energia
    subtitle: A economia de bateria vale no Bluetooth sem o cabo. Conectado, o teclado nunca dorme.
  firmware:
    title: Firmware
    subtitle: Atualize o firmware do teclado ou volte ao original.
  settings:
    title: Configurações
    subtitle: Preferências do próprio app. Os ajustes do teclado estão nas outras páginas.

