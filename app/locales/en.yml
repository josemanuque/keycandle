note:
  side_brightness_follows: The side lights use the keys' brightness. Turn off “Same brightness as the keys” to set their own.
  color_unused: This effect makes its own colors, so the color isn't used. Effects under “Your color” use it.
  speed_unused: This effect doesn't move, so it has no speed.

