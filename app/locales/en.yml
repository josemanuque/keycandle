# English (the fallback: every key must exist here). Other languages mirror this file;
# `cargo test` checks none of them misses a key. %{name} is filled in by the app.
_version: 1

app:
  name: Keycandle
  subtitle: for the RK71
  language: Language

page:
  overview:
    title: Overview
    subtitle: Everything on the keyboard, in one place. Changes apply live and are saved on the keyboard.
  lighting:
    title: Lighting
    subtitle: Pick an effect to see it here and on the keyboard. Changes are saved once you stop adjusting.
  keys:
    title: Keys & indicators
    subtitle: How locks show and what Fn highlights. Windows/Mac is remembered per device (Fn + A / Fn + S).
  power:
    title: Power
    subtitle: Battery saving applies on Bluetooth without the cable. Plugged in, the keyboard never sleeps.
  firmware:
    title: Firmware
    subtitle: Update the keyboard's firmware or go back to the original.
  settings:
    title: Settings
    subtitle: The app's own preferences. The keyboard's settings are on the other pages.

